name: Deploy Blog to Server

on:
  push:
    branches:
      - run

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build and Pack
        run: |
          bun install
          bun --bun run build
          tar -czf blog-build.tar.gz build

      - name: Upload Archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          source: "blog-build.tar.gz"
          target: "~/"

      - name: Sync and Restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          WORK_PATH: ${{ secrets.WORK_PATH }}
          DNS_MANAGER_TOKEN: ${{ secrets.DNS_MANAGER_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          envs: WORK_PATH,DNS_MANAGER_TOKEN
          script: |
            set -e
            cd $WORK_PATH
            export PATH="$HOME/.bun/bin:$PATH"
            git fetch origin run
            git checkout run
            git reset --hard origin/run
            bun --bun --smol install
            rm -rf build
            tar -xzf ~/blog-build.tar.gz
            rm -f ~/blog-build.tar.gz
            echo "DNS_MANAGER_TOKEN=$DNS_MANAGER_TOKEN" >> .env
            sudo systemctl restart dra-tool.service